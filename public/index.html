<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#080d17">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<script>try{const t=localStorage.getItem("theme")||(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark");document.documentElement.dataset.theme=t}catch(e){}</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vóley">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<title>Vóley</title>
<style>
:root{
  --A:#3b82f6;--B:#f43f5e;--ok:#22c55e;
  --sb:env(safe-area-inset-bottom);--st:env(safe-area-inset-top);
  --r:18px;--fd:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --fb:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
:root,[data-theme=dark]{
  --bg:#080d17;--bg2:#0c1322;--surface:#111a2b;--surface2:#18233a;--line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.13);
  --txt:#eef2f8;--mut:#8592a8;--acc:#ffc21a;--accTxt:#1a1300;--shadow:0 10px 30px rgba(0,0,0,.35);--glass:rgba(8,13,23,.78);
  --court1:#e9a35b;--court2:#d58640;color-scheme:dark;
}
[data-theme=light]{
  --bg:#eef2f7;--bg2:#e6ebf3;--surface:#ffffff;--surface2:#f1f4f9;--line:rgba(15,23,42,.07);--line2:rgba(15,23,42,.14);
  --txt:#0f172a;--mut:#64748b;--acc:#f5b400;--accTxt:#241a00;--shadow:0 8px 24px rgba(15,23,42,.08);--glass:rgba(238,242,247,.82);
  --court1:#f0b06b;--court2:#e39550;color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.4 var(--fb);overscroll-behavior:none;transition:background .25s,color .25s}
body{background:radial-gradient(1200px 500px at 50% -200px,var(--bg2),var(--bg))fixed}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:active{transform:scale(.97)}
svg.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
input,select{font:inherit;color:var(--txt);background:var(--surface2);border:1.5px solid var(--line2);border-radius:12px;padding:11px 12px;width:100%;outline:none;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 25%,transparent)}
select{appearance:none;-webkit-appearance:none;text-overflow:ellipsis}
.wrap{max-width:760px;margin:0 auto}
header{position:sticky;top:0;z-index:5;background:var(--glass);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);padding:calc(var(--st) + 8px) 14px 8px;border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;gap:10px;padding:0 2px 10px}
.brand{display:flex;align-items:center;gap:9px;flex:1;min-width:0}
.brand .logo{width:32px;height:32px;border-radius:10px;background:var(--acc);color:var(--accTxt);display:grid;place-items:center;box-shadow:0 4px 14px color-mix(in srgb,var(--acc) 40%,transparent)}
.brand .logo svg{width:20px;height:20px}
.brand h1{margin:0;font:800 24px/1 var(--fd);letter-spacing:.5px;text-transform:uppercase}
.sync{font-size:12px;color:var(--mut);display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);padding:5px 10px;border-radius:999px;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 25%,transparent)}
.dot.off{background:var(--B);box-shadow:0 0 0 3px color-mix(in srgb,var(--B) 25%,transparent)}
.dot.busy{background:var(--acc);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.35}}
.iconbtn{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);color:var(--txt)}
nav{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:4px}
nav button{padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--mut);border-radius:12px;transition:background .2s,color .2s}
nav button svg.i{width:22px;height:22px}
nav button.on{background:var(--acc);color:var(--accTxt);box-shadow:0 4px 14px color-mix(in srgb,var(--acc) 35%,transparent)}
main{padding:16px 14px calc(90px + var(--sb))}
.view{animation:fadein .25s ease}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.card h2{margin:0 0 12px;font:700 15px/1 var(--fd);color:var(--mut);text-transform:uppercase;letter-spacing:1.2px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.count{font:700 12px/1 var(--fb);color:var(--mut);background:var(--surface2);border-radius:999px;padding:4px 9px;letter-spacing:0}
.title{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin:2px 2px 14px}
.title h2{margin:0;font:800 30px/1 var(--fd);text-transform:uppercase;letter-spacing:.3px}
.title p{margin:4px 0 0;color:var(--mut);font-size:13px}
.row{display:flex;align-items:center;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:5px 13px 5px 5px;font-size:15px;font-weight:600;transition:border-color .2s}
.chip:hover{border-color:var(--line2)}
.chip.plain{padding:7px 13px}
.av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:800 14px/1 var(--fd);background:color-mix(in srgb,var(--acc) 22%,var(--surface2));color:var(--txt)}
.av.A{background:var(--A);color:#fff}.av.B{background:var(--B);color:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--surface2);border:1px solid var(--line2);border-radius:14px;padding:11px 16px;font-weight:700}
.btn.pri{background:var(--acc);color:var(--accTxt);border-color:transparent;box-shadow:0 6px 18px color-mix(in srgb,var(--acc) 35%,transparent)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:11px}
.btn.sm svg.i{width:16px;height:16px}
.btn.full{width:100%}
.btn.ghost{background:transparent}
.btn.danger{color:var(--B)}
.btn.big{padding:16px;font:800 20px/1 var(--fd);letter-spacing:.6px;text-transform:uppercase}
.mut{color:var(--mut);font-size:13px}
@media (max-width:420px){.hide-xs{display:none}}
.tag{font-size:11px;font-weight:700;color:var(--mut);background:var(--surface2);border-radius:6px;padding:2px 6px;margin-left:6px;vertical-align:1px}
.tag.cap{background:var(--acc);color:var(--accTxt)}
.pl{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}
.pl:last-child{border-bottom:0;padding-bottom:0}
.pl .who{display:flex;align-items:center;gap:10px;min-width:0;font-weight:600}
.seg{display:flex;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{padding:7px 12px;border-radius:9px;font-size:13px;font-weight:700;color:var(--mut);min-width:42px;transition:background .2s,color .2s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg button.on{background:var(--surface);color:var(--txt);box-shadow:0 1px 4px rgba(0,0,0,.15)}
.seg button.on.A{background:var(--A);color:#fff}.seg button.on.B{background:var(--B);color:#fff}
.teamhead{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tbox{border-radius:14px;padding:12px;background:color-mix(in srgb,var(--c) 12%,var(--surface2));border:1.5px solid color-mix(in srgb,var(--c) 45%,transparent)}
.tbox.A{--c:var(--A)}.tbox.B{--c:var(--B)}
.tbox .old{background:transparent;border:0;padding:0;font:800 17px/1.1 var(--fd);text-transform:uppercase;letter-spacing:.3px;box-shadow:none}
.tbox .cnt{font-size:12px;color:var(--mut);margin-top:4px;display:flex;align-items:center;gap:6px}
.tbox .cnt i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.court{position:relative;background:linear-gradient(var(--court1),var(--court2));border-radius:14px;padding:24px 8px 8px;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;color:#2b1503;box-shadow:inset 0 0 0 3px rgba(255,255,255,.35)}
.court::before{content:"RED";position:absolute;top:0;left:0;right:0;height:17px;background:repeating-linear-gradient(90deg,#fff 0 3px,#e7e7e7 3px 6px);border-radius:14px 14px 0 0;font:800 10px/17px var(--fd);color:#666;text-align:center;letter-spacing:4px}
.court .z{background:rgba(255,255,255,.6);border-radius:9px;padding:5px 4px;text-align:center;min-height:46px;position:relative}
.court .z .n{font:700 10px/1 var(--fd);opacity:.6;letter-spacing:.5px;display:flex;align-items:center;justify-content:center;gap:3px;height:12px}
.court .z .n svg{width:11px;height:11px;stroke-width:2.5}
.court .z .p{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.court .z.set{background:#fff;box-shadow:0 0 0 2.5px var(--acc)}
.court .z.srv{box-shadow:0 0 0 2.5px #166534 inset}
.court .z select{background:#fff;color:#2b1503;border:0;padding:5px 2px;text-align:center;font-weight:700;font-size:14px;border-radius:7px;margin-top:3px}
.court.mini{padding:17px 4px 4px;gap:3px;border-radius:11px}
.court.mini::before{height:12px;font-size:8px;line-height:12px;border-radius:11px 11px 0 0}
.court.mini .z{min-height:34px;padding:3px 2px;border-radius:7px}
.court.mini .z .p{font-size:11px;margin-top:2px}
.court.mini .z .n{font-size:8px;height:9px}
.rbig{font:800 38px/1 var(--fd);color:var(--acc);letter-spacing:1px}
.lbl{font:700 12px/1 var(--fb);color:var(--mut);margin:16px 0 8px;text-transform:uppercase;letter-spacing:.8px}
.grid6{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.grid6 button{padding:10px 0;border-radius:11px;background:var(--surface2);border:1px solid var(--line);font:800 16px/1 var(--fd);letter-spacing:.5px}
.grid6 button.on{background:var(--acc);color:var(--accTxt);border-color:transparent}
.grid2{display:block}
.empty{text-align:center;padding:30px 16px;color:var(--mut)}
.empty svg.i{width:44px;height:44px;stroke-width:1.5;margin-bottom:8px;color:var(--acc)}
.empty b{display:block;color:var(--txt);font:800 22px/1.1 var(--fd);text-transform:uppercase;margin-bottom:6px}

.capsel{position:relative;display:flex;align-items:center;gap:8px;background:var(--surface);border:1.5px solid var(--line2);border-radius:12px;padding:5px 30px 5px 6px}
.capsel select{border:0;background:transparent;padding:4px 0;font-weight:700;box-shadow:none}
.capsel .chev{position:absolute;right:9px;width:16px;height:16px;transform:rotate(90deg);color:var(--mut);pointer-events:none}
.tname{display:flex;align-items:center;gap:6px;background:var(--surface);border:1.5px solid var(--line2);border-radius:12px;padding:4px 4px 4px 11px;cursor:text}
.tname:focus-within{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 25%,transparent)}
.tname input{flex:1;min-width:0;border:0;background:transparent;padding:6px 0;font:800 17px/1.1 var(--fd);text-transform:uppercase;letter-spacing:.3px;box-shadow:none!important}
.tname .pen{width:32px;height:32px;flex:none;border-radius:9px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c)}
.tname .pen svg.i{width:16px;height:16px}
.tbox .cnt{margin-top:10px}
@media (max-width:520px){.teamhead{grid-template-columns:1fr}}
.localbar{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px dashed var(--line2);border-radius:14px;padding:9px 10px 9px 12px;margin-bottom:12px}
.localbar>svg.i{color:var(--mut)}
.localbar div{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.localbar b{font-size:13.5px}.localbar span{font-size:12px;color:var(--mut)}
.localbar.on{border-style:solid;border-color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,var(--surface))}
.localbar.on>svg.i{color:var(--acc)}
.fslocal{font:700 10px/1.2 var(--fb);color:var(--acc);text-transform:uppercase;text-align:center;letter-spacing:.4px}
/* marcador */
.sbhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.setpill{display:flex;align-items:baseline;gap:8px}
.setpill b{font:800 32px/1 var(--fd);text-transform:uppercase}
.setpill .tb{font:700 12px/1 var(--fb);background:var(--acc);color:var(--accTxt);padding:4px 8px;border-radius:7px;text-transform:uppercase;letter-spacing:.5px}
.hist{display:flex;gap:6px;flex-wrap:wrap;margin:-4px 0 12px}
.hist span{font:700 13px/1 var(--fd);letter-spacing:.5px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:5px 8px;color:var(--mut)}
.hist span b{color:var(--txt)}
.board{display:grid;grid-template-columns:1fr 48px 1fr;gap:8px;align-items:start;max-width:980px;margin:0 auto}
.side{position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:12px 10px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0;box-shadow:var(--shadow)}
.side::before{content:"";position:absolute;inset:0 0 auto 0;height:120px;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 28%,transparent),transparent);pointer-events:none}
.side.A{--c:var(--A)}.side.B{--c:var(--B)}
.side>*{position:relative}
.side .nm{font:800 17px/1.05 var(--fd);text-transform:uppercase;letter-spacing:.4px;text-align:center;width:100%;min-height:36px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.sets{display:flex;gap:6px;align-items:center}
.sets i{width:12px;height:12px;border-radius:4px;border:2px solid var(--line2);transform:rotate(45deg)}
.sets i.w{background:var(--acc);border-color:var(--acc);box-shadow:0 0 10px color-mix(in srgb,var(--acc) 60%,transparent)}
.srvb{height:22px;display:flex;align-items:center}
.srvb span{display:inline-flex;align-items:center;gap:5px;font:800 12px/1 var(--fb);letter-spacing:1px;color:var(--accTxt);background:var(--acc);padding:4px 9px 4px 6px;border-radius:999px}
.srvb svg.i{width:14px;height:14px;stroke-width:2.4;animation:spin2 3s linear infinite}
@keyframes spin2{to{transform:rotate(360deg)}}
.pts{font:800 clamp(84px,min(34vw,30vh),220px)/.9 var(--fd);font-variant-numeric:tabular-nums;letter-spacing:-2px;transition:transform .15s}
.pts.bump{animation:bump .3s ease}
@keyframes bump{40%{transform:scale(1.12)}}
.plus{width:100%;height:68px;border-radius:16px;font:800 34px/1 var(--fd);color:#fff;background:var(--c);box-shadow:0 8px 22px color-mix(in srgb,var(--c) 45%,transparent);display:flex;align-items:center;justify-content:center;gap:4px}
.plus svg.i{width:26px;height:26px;stroke-width:3}
.minus{width:100%;height:38px;border-radius:12px;background:var(--surface2);border:1px solid var(--line);color:var(--mut);display:grid;place-items:center}
.rline{display:flex;align-items:center;gap:8px}
.rline .r{font:800 28px/1 var(--fd);color:var(--acc)}
.rbtn{width:34px;height:34px;border-radius:11px;background:var(--surface2);border:1px solid var(--line);display:grid;place-items:center;color:var(--mut)}
.rbtn svg.i{width:16px;height:16px}
.mid{display:flex;flex-direction:column;align-items:center;gap:8px;padding-top:110px}
.swap{width:48px;height:48px;border-radius:16px;background:var(--surface);border:1px solid var(--line2);display:grid;place-items:center;box-shadow:var(--shadow)}
.setlbl{font:700 10px/1.2 var(--fb);color:var(--mut);text-align:center;text-transform:uppercase;letter-spacing:.5px}
.banner{position:relative;overflow:hidden;border-radius:20px;padding:18px 16px;margin-bottom:12px;text-align:center;color:#fff;background:linear-gradient(135deg,color-mix(in srgb,var(--c) 85%,#000),var(--c));box-shadow:0 10px 30px color-mix(in srgb,var(--c) 35%,transparent)}
.banner.A{--c:var(--A)}.banner.B{--c:var(--B)}
.banner .ic{width:46px;height:46px;border-radius:14px;background:rgba(255,255,255,.18);display:grid;place-items:center;margin:0 auto 8px}
.banner .ic svg.i{width:26px;height:26px}
.banner b{font:800 26px/1.05 var(--fd);text-transform:uppercase;display:block}
.banner .sc{font:700 15px/1 var(--fd);opacity:.85;margin-top:4px;letter-spacing:.5px}
.banner .row{justify-content:center;margin-top:14px}
.banner .btn{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.25);color:#fff}
.banner .btn.pri{background:#fff;color:#111;box-shadow:none}
.teamsetup{border-top:4px solid var(--c)}
.teamsetup.A{--c:var(--A)}.teamsetup.B{--c:var(--B)}
/* hojas y diálogos */
.ov{position:fixed;inset:0;background:rgba(3,6,12,.5);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:20;display:flex;align-items:flex-end;justify-content:center;animation:ovin .2s ease}
@keyframes ovin{from{opacity:0}}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:10px 18px calc(20px + var(--sb));max-height:90vh;overflow:auto;border:1px solid var(--line);box-shadow:0 -10px 40px rgba(0,0,0,.3);animation:up .28s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(100%)}}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line2);margin:0 auto 12px}
.shead{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.shead h3{margin:0;font:800 24px/1 var(--fd);text-transform:uppercase;letter-spacing:.3px}
.chk{display:flex;flex-wrap:wrap;gap:8px}
.chk label{display:flex;align-items:center;gap:7px;background:var(--surface2);border:1.5px solid var(--line);border-radius:999px;padding:8px 13px;font-size:14px;font-weight:600;cursor:pointer;transition:all .15s}
.chk label:has(input:checked){border-color:var(--acc);background:color-mix(in srgb,var(--acc) 18%,var(--surface2))}
.chk input{width:auto;margin:0;accent-color:var(--acc)}
.err{color:var(--B);font-size:13px;font-weight:600;margin-top:6px;display:flex;align-items:center;gap:6px}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
.dlg{background:var(--surface);width:100%;max-width:420px;border-radius:26px 26px 0 0;padding:22px 20px calc(20px + var(--sb));text-align:center;border:1px solid var(--line);animation:up .28s cubic-bezier(.2,.9,.3,1)}
.dlg .dic{width:60px;height:60px;border-radius:20px;margin:0 auto 12px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c)}
.dlg .dic svg.i{width:30px;height:30px}
.dlg h3{margin:0 0 8px;font:800 26px/1.05 var(--fd);text-transform:uppercase}
.dlg p{margin:0 0 18px;color:var(--mut);font-size:14px;line-height:1.5}
.dlg .acts{display:flex;flex-direction:column-reverse;gap:8px}
.dlg .acts .btn{padding:13px}
.dlg .btn.go{background:var(--c);color:var(--ct,#fff);border-color:transparent}
.toasts{position:fixed;left:0;right:0;top:calc(var(--st) + 12px);z-index:60;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{display:flex;align-items:center;gap:9px;background:var(--txt);color:var(--bg);padding:10px 16px 10px 12px;border-radius:999px;font-weight:700;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.3);animation:tin .3s cubic-bezier(.2,1.3,.4,1)}
.toast svg.i{width:18px;height:18px;color:var(--acc);stroke-width:2.5}
.toast.out{animation:tout .25s forwards}
@keyframes tin{from{opacity:0;transform:translateY(-20px) scale(.9)}}
@keyframes tout{to{opacity:0;transform:translateY(-12px)}}
/* responsive */

<body>
<header><div class="wrap"><div class="hrow"><div class="brand"><div class="logo" id="logo"></div><h1>Vóley</h1></div>
<div class="sync"><span class="dot busy" id="dot"></span><span id="syncTxt">Conectando…</span></div>
<button class="iconbtn" id="themeBtn" aria-label="Cambiar tema"></button></div>
<nav id="nav"></nav></div></header>
<main id="app" class="wrap"></main>
<div class="toasts" id="toasts"></div>
<div id="fs"></div>
<div id="dlg"></div>
<div id="sheet"></div>

<script>
/* ---------- Datos ---------- */
const POS=[['col','Colocadores','Colocador'],['opu','Opuestos','Opuesto'],['cen','Centrales','Central'],['rec','Receptores','Receptor'],['lib','Líberos / Capitanes','Líbero']];
const POSL=Object.fromEntries(POS.map(p=>[p[0],p[2]]));
const ZONES_VIEW=[4,3,2,5,6,1];
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const other=t=>t==='A'?'B':'A';
const clone=o=>JSON.parse(JSON.stringify(o));

function newTeam(name,cap){return{name,captain:cap,members:cap?[cap]:[],court:[null,null,null,null,null,null],libero:cap||null,setter:null,rot0:1}}
function newSet(num,serving){return{num,A:0,B:0,serving,firstServe:serving,started:false,court:{A:[],B:[]},setter:{A:null,B:null},rot:{A:1,B:1},hist:[],winner:null}}
function newMatch(bestOf){return{bestOf,setsWon:{A:0,B:0},scores:[],swapped:false,finished:null,set:newSet(1,'A')}}
function initial(){
  const P=[];const add=(name,pos)=>{const id=uid();P.push({id,name,pos});return id};
  add('Álvaro',['col']);add('Tingu',['col']);
  add('Mao',['opu']);add('Tiki',['opu']);
  add('Carlos',['cen','rec']);add('Claudio',['cen']);add('Manu',['cen']);add('Mario',['cen']);
  add('Gonzalo',['rec']);add('Guille',['rec']);add('Pablo',['rec']);
  const j=add('Joselu',['lib']);const r=add('Rolly',['lib']);
  return{version:0,players:P,teams:{A:newTeam('Equipo Joselu',j),B:newTeam('Equipo Rolly',r)},match:newMatch(5)};
}

/* ---------- Lógica de rotación y marcador ---------- */
// court[i] = jugador en zona i+1. Rotar: el de zona 2 pasa a zona 1, el de 1 a 6...
const rotArr=(c,dir)=>c.length?c.map((_,i)=>c[(i+(dir>0?1:5))%6]):c;
const nextR=(r,dir)=>dir>0?(r===1?6:r-1):(r===6?1:r+1); // R = zona del colocador
const pname=id=>S.players.find(p=>p.id===id)?.name||'';
function baseRot(t){const T=S.teams[t];const i=T.setter?T.court.indexOf(T.setter):-1;return i>=0?i+1:(T.rot0||1)}
function rotateBase(t,dir){const T=S.teams[t];const on=T.setter&&T.court.includes(T.setter);T.court=rotArr(T.court,dir);if(!on)T.rot0=nextR(T.rot0||1,dir)}
function rotateSet(t,dir){const s=S.match.set;s.court[t]=rotArr(s.court[t],dir);s.rot[t]=nextR(s.rot[t],dir)}
function setRTo(t,r,scope){for(let k=0;k<6;k++){const cur=scope==='set'?S.match.set.rot[t]:baseRot(t);if(cur===r)return;scope==='set'?rotateSet(t,1):rotateBase(t,1)}}
const need=()=>(S.match.bestOf+1)/2;
const target=()=>S.match.set.num===S.match.bestOf?15:25;
function checkWin(){const m=S.match,s=m.set,tg=target();for(const t of['A','B']){if(s[t]>=tg&&s[t]-s[other(t)]>=2){s.winner=t;m.setsWon[t]++;m.scores.push({A:s.A,B:s.B,w:t});if(m.setsWon[t]>=need())m.finished=t;return}}}
function unwin(){const m=S.match,s=m.set;if(!s.winner)return;m.setsWon[s.winner]--;m.scores.pop();m.finished=null;s.winner=null}
function addPoint(t){const s=S.match.set;if(!s.started||s.winner)return;const prev=s.serving;let rotated=false;s[t]++;if(prev!==t){rotateSet(t,1);rotated=true;s.serving=t}s.hist.push({t,prev,rotated});checkWin()}
function subPoint(t){const s=S.match.set;if(!s.started||s[t]<=0)return;unwin();const i=s.hist.map(h=>h.t).lastIndexOf(t);
  if(i>=0&&i===s.hist.length-1){const h=s.hist.pop();s[t]--;if(h.rotated)rotateSet(t,-1);s.serving=h.prev}
  else{if(i>=0)s.hist.splice(i,1);s[t]--}
  checkWin()}
function startSet(){const s=S.match.set;for(const t of['A','B']){const T=S.teams[t];s.court[t]=[...T.court];s.setter[t]=T.setter;s.rot[t]=baseRot(t)}s.firstServe=s.serving;s.started=true}
function nextSet(){const m=S.match;if(m.finished||!m.set.winner)return;m.set=newSet(m.set.num+1,other(m.set.firstServe));m.swapped=!m.swapped}
function placeZone(arr,z,id){const j=id?arr.indexOf(id):-1;if(j>=0&&j!==z)arr[j]=arr[z];arr[z]=id||null}
function removeFromTeam(t,id){const T=S.teams[t];T.members=T.members.filter(x=>x!==id);T.court=T.court.map(x=>x===id?null:x);if(T.libero===id)T.libero=null;if(T.setter===id)T.setter=null}

/* ---------- Sincronización ---------- */
let S=null,ver=0,ops=[],flushing=false,online=true,dirtyRender=false,seq=0;
const ui={tab:localStorage.getItem('tab')||'marcador',rotTeam:'A',sheet:null,local:localStorage.getItem('local')==='1'};
function setSync(state){const d=document.getElementById('dot'),t=document.getElementById('syncTxt');
  if(ui.local){d.className='dot busy';d.style.animation='none';t.textContent='Solo este móvil';return}d.style.animation='';
  d.className='dot'+(state==='off'?' off':state==='busy'?' busy':'');t.textContent=state==='off'?'Sin conexión':state==='busy'?'Guardando':'En vivo'}
// Cada cambio lleva un id; el estado guarda los últimos ids aplicados para no aplicarlo dos veces
function applyOp(st,op){st.applied=st.applied||[];if(st.applied.includes(op.id))return;op.fn(st);st.applied.push(op.id);if(st.applied.length>200)st.applied.splice(0,st.applied.length-200)}
function saveCache(){try{localStorage.setItem('cache',JSON.stringify({S,ver}))}catch(e){}}
function mutate(fn){if(!S)return;if(ui.local){fn(S);saveCache();render();return}seq++;const op={id:uid()+uid(),fn};applyOp(S,op);ops.push(op);saveCache();render();flush()}
async function flush(){
  if(flushing||!ops.length)return;flushing=true;setSync('busy');
  const sent=ops.length;
  try{
    const r=await fetch('/api/state',{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify({base:ver,state:S})});
    const j=await r.json();
    if(r.ok){ver=j.version;S.version=ver;ops.splice(0,sent);online=true;saveCache()}
    else if(r.status===409){ // otro móvil cambió algo: aplicamos encima solo los cambios que el servidor aún no tiene
      online=true;S=j.state||initial();ver=j.version;const done=S.applied||[];ops=ops.filter(op=>!done.includes(op.id));for(const op of ops)applyOp(S,op);saveCache();render()}
    else throw new Error(j.error||r.status);
  }catch(e){online=false}
  flushing=false;setSync(online?(ops.length?'busy':'ok'):'off');
  if(online&&ops.length)flush();
}
async function poll(){
  if(flushing||document.hidden||ui.local)return;
  if(ops.length){flush();return}
  const mySeq=seq;
  try{
    const r=await fetch('/api/state',{cache:'no-store'});const j=await r.json();online=true;
    // Si mientras esperábamos hubo un cambio local o un guardado, esta respuesta puede ser vieja: se ignora
    if(mySeq!==seq||flushing||ops.length)return;
    if(j.state===null){S=initial();mutate(()=>{});return}
    if(j.state&&j.version>ver){S=j.state;ver=j.version;saveCache();safeRender()}
    setSync('ok');
  }catch(e){online=false;setSync('off')}
}
function safeRender(){const a=document.activeElement;if(a&&(a.tagName==='INPUT'||a.tagName==='SELECT')){dirtyRender=true;return}render()}
document.addEventListener('focusout',()=>setTimeout(()=>{if(dirtyRender){dirtyRender=false;safeRender()}},50));

/* ---------- Iconos propios ---------- */
const ICONS={
  jersey:'<path d="M8.5 3.5 4 6l1.8 4.6L7.5 10v10h9V10l1.7.6L20 6l-4.5-2.5c-.4 1.6-1.8 2.7-3.5 2.7s-3.1-1.1-3.5-2.7Z"/><path d="M10 13h4"/>',
  shield:'<path d="M12 3 4.5 6v5.5c0 4.6 3.1 8.1 7.5 9.5 4.4-1.4 7.5-4.9 7.5-9.5V6L12 3Z"/><path d="M12 3v18"/><path d="M4.8 11h14.4"/>',
  rotate:'<rect x="3.5" y="5" width="17" height="14" rx="2"/><path d="M3.5 12h17"/><path d="M15.5 8.5a3.5 3.5 0 1 0 1 2.5"/><path d="M16.5 7v2.6h-2.6"/>',
  board:'<rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="M12 5v14"/><path d="M6 10.5V14M6 10.5 7 9.8"/><path d="M15.3 9.8h2.4v4.4h-2.4z"/><path d="M9 3l1.5 2M15 3l-1.5 2"/>',
  ball:'<circle cx="12" cy="12" r="9"/><path d="M12 3c-2.2 3-2.5 6.3-.8 9.3"/><path d="M3.6 9.2c3.7-.4 6.4.8 7.6 3.1"/><path d="M11.2 12.3c2.7.4 5.7-.6 8.6-3"/><path d="M11.2 12.3c-1.2 2.7-3.3 5-6.4 6.2"/><path d="M11.2 12.3c1 2.8 3.4 5.4 6.6 6.4"/>',
  dice:'<rect x="3.5" y="3.5" width="17" height="17" rx="4"/><circle cx="8.3" cy="8.3" r=".9" fill="currentColor"/><circle cx="15.7" cy="8.3" r=".9" fill="currentColor"/><circle cx="12" cy="12" r=".9" fill="currentColor"/><circle cx="8.3" cy="15.7" r=".9" fill="currentColor"/><circle cx="15.7" cy="15.7" r=".9" fill="currentColor"/>',
  edit:'<path d="M4 20h4.5L19.3 9.2a2.1 2.1 0 0 0 0-3l-1.5-1.5a2.1 2.1 0 0 0-3 0L4 15.5V20Z"/><path d="m13.5 6 4.5 4.5"/>',
  swap:'<path d="M4 8h14l-3.5-3.5"/><path d="M20 16H6l3.5 3.5"/>',
  trophy:'<path d="M7.5 4h9v5a4.5 4.5 0 0 1-9 0V4Z"/><path d="M7.5 6H4.5v1.5A3 3 0 0 0 7.6 10.5"/><path d="M16.5 6h3v1.5a3 3 0 0 1-3.1 3"/><path d="M12 13.5V17"/><path d="M8.5 20.5h7l-.8-3.5H9.3l-.8 3.5Z"/>',

function dialog({icon='warn',tone='acc',title,text,ok='Aceptar',cancel='Cancelar'}){
  return new Promise(res=>{
    const el=document.getElementById('dlg');
    const c=tone==='danger'?'var(--B)':tone==='A'?'var(--A)':tone==='B'?'var(--B)':'var(--acc)',ct=tone==='acc'?'var(--accTxt)':'#fff';
    el.innerHTML=`<div class="ov" data-d="0"><div class="dlg" style="--c:${c};--ct:${ct}"><div class="dic">${ic(icon)}</div><h3>${title}</h3><p>${text}</p>
      <div class="acts">${cancel?`<button class="btn ghost" data-d="0">${cancel}</button>`:''}<button class="btn go" data-d="1">${ok}</button></div></div></div>`;
    el.onclick=e=>{const b=e.target.closest('[data-d]');if(!b)return;if(b.classList.contains('ov')&&e.target!==b)return;el.innerHTML='';el.onclick=null;res(b.dataset.d==='1')};

function toast(text,icon='check'){
  const box=document.getElementById('toasts');const t=document.createElement('div');t.className='toast';t.innerHTML=ic(icon)+`<span>${text}</span>`;

async function goLocal(){
  const y=await dialog({icon:'board',title:'¿Marcador solo en este móvil?',text:'Llevas el partido sin conectarte al servidor, así no se gastan créditos. Los demás no verán los puntos hasta que lo subas. Mientras tanto, solo el marcador se guarda: no cambies plantilla ni equipos.',ok:'Usar solo este móvil',cancel:'Seguir en vivo'});

async function goLive(){
  toast('Subiendo el marcador…','reset');
  for(let i=0;i<3;i++){
    try{const r=await fetch('/api/state?fresh='+Date.now(),{cache:'no-store'});const j=await r.json();
      const base=j.state||initial();base.match=S.match;
      const u=await fetch('/api/state',{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify({base:j.version,state:base})});
      const k=await u.json();
      if(u.ok){base.version=k.version;S=base;ver=k.version;ops=[];saveCache();setLocal(false);toast('Marcador subido: ya lo ven todos','check');return}
    }catch(e){}
  }

    go(L,{x:L==='A'?-fw:W+fw,y:GY-fh*.6,r:-200},900,'cubic-bezier(.2,.6,.4,1)');
    q('.half.'+L).animate([{filter:'none'},{filter:'grayscale(1) brightness(.3)'}],{duration:600,fill:'forwards'});
    await wait(500);F[w].pose('charge');aura(w,true);go(w,{x:mid},500,'cubic-bezier(.2,1.2,.4,1)');
    q('.half.'+w).animate([{clipPath:w==='A'?'polygon(0 0,62% 0,38% 100%,0 100%)':'polygon(62% 0,100% 0,100% 100%,38% 100%)'},{clipPath:'polygon(0 0,100% 0,100% 100%,0 100%)'}],{duration:700,easing:'cubic-bezier(.2,.9,.3,1)',fill:'forwards'});
    q('.res').animate([{opacity:0,transform:'scale(2)'},{opacity:1,transform:'scale(1)'}],{duration:450,easing:'cubic-bezier(.2,1.4,.4,1)',fill:'forwards'});
    q('.skip').style.display='none';
    const cols=['#ffc21a','#fff',w==='A'?'#3b82f6':'#f43f5e'];
    for(let i=0;i<80;i++){const c=fx('conf',W/2,H*.45);c.style.background=cols[i%3];
      const a=Math.random()*Math.PI*2,r=150+Math.random()*330,x=Math.cos(a)*r,y=Math.sin(a)*r-140;
      c.animate([{transform:'translate(-50%,-50%)',opacity:1},{transform:`translate(${x}px,${y}px) rotate(${Math.random()*720}deg)`,opacity:1,offset:.6},{transform:`translate(${x}px,${y+320}px) rotate(${Math.random()*1080}deg)`,opacity:0}],{duration:1700+Math.random()*900,easing:'cubic-bezier(.1,.7,.3,1)',fill:'forwards'})}
    ended=true;await wait(3800);close();
  }
  function close(){if(!ov.isConnected)return;alive=false;timers.forEach(clearTimeout);ov.classList.remove('show');setTimeout(()=>{ov.remove();coinBusy=false},220)}
  q('.skip').addEventListener('click',e=>{e.stopPropagation();close();toast(`Duelo ganado: saca ${esc(S.teams[w].name)}`,'ball')});
  ov.addEventListener('click',()=>{if(ended)close()});
  run().catch(()=>{});
}
function maybeCoin(){const s=S&&S.match.set;if(!s)return;
  if(lastDrawn===null){lastDrawn=s.drawn||0;return}
  if(s.drawn&&s.drawn!==lastDrawn){lastDrawn=s.drawn;if(!s.started)coinFlip(s.serving)}}

/* ---------- Eventos ---------- */
const lastTap={};function tapGuard(k){const n=Date.now();if(n-(lastTap[k]||0)<300)return true;lastTap[k]=n;return false}
const TABS=[['plantilla','jersey','Plantilla'],['equipos','shield','Equipos'],['rotacion','rotate','Rotación'],['marcador','board','Marcador']];
document.getElementById('nav').innerHTML=TABS.map(([k,i,l])=>`<button data-tab="${k}">${ic(i)}<span>${l}</span></button>`).join('');
document.getElementById('logo').innerHTML=ic('ball');
applyTheme(curTheme());
document.getElementById('themeBtn').addEventListener('click',()=>{const t=curTheme()==='light'?'dark':'light';applyTheme(t);toast(t==='light'?'Modo claro':'Modo oscuro',t==='light'?'sun':'moon')});
document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;ui.tab=b.dataset.tab;localStorage.setItem('tab',ui.tab);schedulePoll();window.scrollTo(0,0);render()});
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(!el)return;const a=el.dataset.a,t=el.dataset.t,id=el.dataset.id;
  if(a==='ovClose'){if(e.target===el){ui.sheet=null;renderSheet()}return}
  switch(a){
    case 'add':if(tapGuard('add'+t))break;mutate(()=>addPoint(t));{const e=document.getElementById('pts'+t);if(e){e.classList.remove('bump');void e.offsetWidth;e.classList.add('bump')}}if(navigator.vibrate)navigator.vibrate(15);break;
    case 'sub':if(tapGuard('sub'+t))break;mutate(()=>subPoint(t));break;
    case 'editName':{e.preventDefault();const i=document.getElementById('tn'+t);if(i){i.focus();i.select()}break}
    case 'goLocal':goLocal();break;
    case 'goLive':goLive();break;
    case 'fsOn':fsEnter();break;
    case 'fsOff':fsExit();break;
    case 'swap':mutate(S=>{S.match.swapped=!S.match.swapped});toast('Cambio de campo','swap');break;
    case 'nextSet':mutate(()=>nextSet());break;
    case 'startSet':mutate(()=>{if(!S.match.set.started)startSet()});toast(`¡Arranca el set ${S.match.set.num}!`,'whistle');break;
    case 'serve':mutate(S=>{if(!S.match.set.started){S.match.set.serving=t;S.match.set.drawn=null}});break;
    case 'drawServe':{if(coinBusy)break;const w=Math.random()<.5?'A':'B',ts=Date.now();lastDrawn=ts;mutate(S=>{const st=S.match.set;if(!st.started){st.serving=w;st.drawn=ts}});coinFlip(w);break}
    case 'serveNow':mutate(S=>{S.match.set.serving=t});renderSheet();break;
    case 'bestOf':mutate(S=>{if(!S.match.scores.length)S.match.bestOf=+el.dataset.n});break;
    case 'resetMatch':dialog({icon:'reset',title:'¿Nuevo partido?',text:'El marcador vuelve a 0–0 y se borran los sets jugados. Equipos y rotaciones se quedan como están.',ok:'Sí, a jugar',cancel:'Seguir con este'}).then(y=>{if(y){mutate(S=>{S.match=newMatch(S.match.bestOf)});toast('Partido nuevo, marcador a cero','whistle')}});break;
    case 'rot':{const d=+el.dataset.d,sc=el.dataset.sc;mutate(()=>sc==='set'?rotateSet(t,d):rotateBase(t,d));if(sc==='set')renderSheet();break}
    case 'setR':{const r=+el.dataset.r,sc=el.dataset.sc;mutate(()=>setRTo(t,r,sc));if(sc==='set')renderSheet();break}
    case 'rotSheet':ui.sheet={k:'rot',t};renderSheet();break;
    case 'rotTeam':ui.rotTeam=t;render();break;
    case 'assign':mutate(S=>{for(const x of['A','B'])if(x!==t)removeFromTeam(x,id);if(t&&!S.teams[t].members.includes(id))S.teams[t].members.push(id)});break;
    case 'clearTeams':dialog({icon:'shield',tone:'danger',title:'¿Deshacer los equipos?',text:'Todos vuelven al banquillo menos los capitanes. Tocará elegir otra vez.',ok:'Deshacer equipos',cancel:'Mejor no'}).then(y=>{if(y){toast('Equipos deshechos','bench');mutate(S=>{for(const x of['A','B']){const T=S.teams[x];for(const m of[...T.members])if(m!==T.captain)removeFromTeam(x,m)}})}});break;
    case 'newPlayer':ui.sheet={k:'player',id:null,name:'',pos:[]};renderSheet();setTimeout(()=>document.getElementById('pName')?.focus(),50);break;
    case 'editPlayer':{const p=S.players.find(x=>x.id===id);ui.sheet={k:'player',id,name:p.name,pos:[...p.pos]};renderSheet();break}
    case 'posChk':break;
    case 'savePlayer':{const sh=ui.sheet;const name=document.getElementById('pName').value.trim();if(!name){const i=document.getElementById('pName');i.classList.remove('shake');void i.offsetWidth;i.classList.add('shake');i.focus();document.getElementById('pErr').innerHTML=`<div class="err">${ic('warn')}Falta el nombre del jugador</div>`;return}
      const pos=[...document.querySelectorAll('[data-a=posChk]:checked')].map(x=>x.value);
      if(sh.id){toast(`${esc(name)} actualizado`);mutate(S=>{const p=S.players.find(x=>x.id===sh.id);if(p){p.name=name;p.pos=pos}})}
      else{const nid=uid();mutate(S=>{S.players.push({id:nid,name,pos})});toast(`Fichado: ${esc(name)}`,'userPlus')}
      ui.sheet=null;renderSheet();break}
    case 'delPlayer':{const pid=ui.sheet.id;const p=S.players.find(x=>x.id===pid);
      dialog({icon:'trash',tone:'danger',title:`¿Borrar a ${esc(p?.name)}?`,text:'Desaparece de la plantilla y de su equipo. Si solo cambia de posición, mejor edítalo.',ok:'Borrar',cancel:'Mejor no'}).then(y=>{if(y){mutate(S=>{S.players=S.players.filter(x=>x.id!==pid);for(const x of['A','B']){removeFromTeam(x,pid);if(S.teams[x].captain===pid)S.teams[x].captain=null}});ui.sheet=null;renderSheet();toast(`${esc(p?.name)} ya no está en la plantilla`,'trash')}});break}
    case 'resetAll':dialog({icon:'reset',tone:'danger',title:'¿Volver al principio?',text:'Se recupera la plantilla original y se pierden fichajes, equipos, rotaciones y marcador. Afecta a todos los móviles.',ok:'Restablecer todo',cancel:'Cancelar'}).then(y=>{if(y){mutate(S=>{const n=initial();n.version=S.version;Object.assign(S,n)});toast('Plantilla restablecida','reset')}});break;
    case 'close':ui.sheet=null;renderSheet();break;
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset?.a==='teamName')e.target.blur()});
document.addEventListener('change',e=>{
  const el=e.target;const a=el.dataset.a,t=el.dataset.t,sc=el.dataset.sc;if(!a)return;
  if(a==='teamName'){const v=el.value.trim()||('Equipo '+(pname(S.teams[t].captain)||t));mutate(S=>{S.teams[t].name=v});toast(`Ahora se llama ${esc(v)}`,'edit')}
  else if(a==='captain'){const v=el.value||null;mutate(S=>{const T=S.teams[t];
      if(v){for(const x of['A','B'])if(x!==t)removeFromTeam(x,v);if(!T.members.includes(v))T.members.push(v);T.name='Equipo '+pname(v)}
      T.captain=v});
    if(v)toast(`${esc(pname(v))} capitanea · ${esc(S.teams[t].name)}`,'shield')}
  else if(a==='zone'){const z=+el.dataset.z,v=el.value;mutate(S=>{
      if(sc==='set'){const s=S.match.set;placeZone(s.court[t],z,v);const i=s.setter[t]?s.court[t].indexOf(s.setter[t]):-1;if(i>=0)s.rot[t]=i+1}
      else placeZone(S.teams[t].court,z,v)});if(sc==='set')renderSheet()}
  else if(a==='setter'){const v=el.value||null;mutate(S=>{
      if(sc==='set'){const s=S.match.set;s.setter[t]=v;const i=v?s.court[t].indexOf(v):-1;if(i>=0)s.rot[t]=i+1}
      else{const T=S.teams[t];if(!v)T.rot0=baseRot(t);T.setter=v}});if(sc==='set')renderSheet()}
  else if(a==='libero'){const v=el.value||null;mutate(S=>{S.teams[t].libero=v})}
});

/* ---------- Arranque ---------- */
try{const c=JSON.parse(localStorage.getItem('cache')||'null');if(c&&c.S){S=c.S;ver=c.ver;render()}}catch(e){}
let pollT=null;
const pollEvery=()=>ui.tab==='marcador'?5000:15000;
function schedulePoll(){clearTimeout(pollT);pollT=setTimeout(async()=>{await poll();schedulePoll()},pollEvery())}
poll();schedulePoll();
document.addEventListener('visibilitychange',()=>{if(!document.hidden)poll()});
if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
</script>
</body>
